[project]
name = "minilab-projet"
version = "0.1.0"
description = "Projet MiniLab : construire, entraîner et servir un petit modèle de langage sur CPU"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1",
 "numpy>=2,<3",
 "torch>=2.5,<3",
 "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
 "httpx2>=2.16,<3",
 "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Sous Linux, le torch de PyPI embarque CUDA (plusieurs Go) : on prend la version CPU.
# macOS et Windows reçoivent déjà une version CPU depuis PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
